<head>
  <meta charset="utf-8">

<body>
  <header class="reserva__header">
    <!-- TODO: nombre o logo del negocio -->
     <img src="./assets/logo.jpg" alt="Logo de Rueda Libre" class="reserva__logo" width="200">
    <nav class="reserva__nav" aria-label="Principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="tarifas.html">Tarifas</a></li>
        <li><a href="reserva.html" aria-current="page">Reserva</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main class="reservas__main">
    <h1>Reserva tu bici eléctrica hoy.</h1>
    <form action="/resservas" method="post" class="reservas__formulario formulario">
      <fieldset>
        <legend>Tus datos</legend>
        <div class="reserva__datos-grid">
          <div class="formulario__campo">
            <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" required>
          </div>
          <div class="formulario__campo">
            <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="formulario__campo reserva__ancho-completo">
            <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" autocomplete="tel" pattern="^[6-9]\d{8}$" title="Debe ser un número de 9 dígitos que empieza por 6, 7, 8 o 9" required>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Tu reserva</legend>
        <div class="reserva__opciones-grid">
          <div class="formulario__campo">
            <label for="servicio">Servicio</label>
          <select id="servicio" name="servicio" required>
            <option value="" disabled selected>Selecciona un servicio</option>
            <option value="alquiler">Alquiler</option>
            <option value="taller">Taller</option>
            <option value="revision">Revisión de batería y motor</option>
            <option value="ruta">Ruta guiada</option>
          </select>
          </div>
          <fieldset class="reserva__modelos">
            <legend>Modelo de bici</legend>
            <div class="reserva__modelo-opciones">
              <label for="modelo-urbana"><input type="radio" id="modelo-urbana" name="modelo" value="urbana"> Urbana</label>
              <label for="modelo-montana"><input type="radio" id="modelo-montana" name="modelo" value="montana"> Montaña</label>
              <label for="modelo-plegable"><input type="radio" id="modelo-plegable" name="modelo" value="plegable"> Plegable</label>
            </div>
          </fieldset>
          <div class="formulario__campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>
          </div>
          <div class="formulario__campo">
            <label for="hora">Hora</label>
            <input type="time" id="hora" name="hora" min="09:30" max="19:30" required>
          </div>
          <div class="formulario__campo">
            <label for="duracion">Duración (horas)</label>
            <input type="number" id="duracion" name="duracion" min="1" max="8" required>
          </div>
          <div class="formulario__campo reserva__ancho-completo">
            <label for="observaciones">Observaciones <span>(opcional)</span></label>
            <textarea id="observaciones" name="observaciones" maxlength="300" rows="4"></textarea>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Consentimiento</legend>
        <label class="formulario__consentimiento" for="confirmacion">
          <input type="checkbox" id="confirmacion" name="confirmacion" required>
          <span>He leído y acepto que Rueda Libre use mis datos únicamente para gestionar esta reserva. Puedo pedir que los borren escribiendo a hola@ruedalibre.example.</span>
        </label>
      </fieldset>
      <button type="submit" class="formulario__boton">Reservar</button>
    </form>
  </main>

  <footer>
    <!-- TODO: dirección, teléfono (tel:) y correo (mailto:) -->
    <p>&copy; Rueda Libre</p>
    <p>Direccion: Calle Principal, 123</p>
    <p>Teléfono: <a href="tel:+34915555555">+34 915 55 55 55</a></p>
    <p>Correo: <a href="mailto:info@ruedalibre.es">info@ruedalibre.es</a></p>
  </footer>
</body>

</html>
